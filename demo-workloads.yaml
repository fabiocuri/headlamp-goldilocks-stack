apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    # tells Goldilocks to generate rightsizing recommendations for this namespace
    goldilocks.fairwinds.com/enabled: "true"
---
# A simple web app — intentionally over-requests CPU/memory so Goldilocks
# will recommend a smaller "plan" (mirrors the screenshot's Current vs Recommended).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: web-frontend }
  template:
    metadata:
      labels: { app: web-frontend }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: demo
spec:
  selector: { app: web-frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
# A busy worker that actually uses some CPU, so the CPU graph isn't flat.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-worker
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: cpu-worker }
  template:
    metadata:
      labels: { app: cpu-worker }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - >
              i=0;
              while true; do
                i=$((i+1));
                echo "[cpu-worker] tick $i — doing pretend work at $(date)";
                md5sum /dev/zero 2>/dev/null & sleep 1; kill %1 2>/dev/null;
                sleep 2;
              done
          resources:
            requests: { cpu: "200m", memory: "128Mi" }
            limits:   { cpu: "400m", memory: "256Mi" }
---
# A pod that just emits logs continuously — handy for the "Logs" button.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-spitter
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: log-spitter }
  template:
    metadata:
      labels: { app: log-spitter }
    spec:
      containers:
        - name: logger
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - >
              n=0;
              while true; do
                n=$((n+1));
                echo "$(date '+%H:%M:%S') INFO  request #$n handled in $((RANDOM % 200))ms";
                if [ $((n % 7)) -eq 0 ]; then echo "$(date '+%H:%M:%S') WARN  slow response detected"; fi;
                sleep 1;
              done
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "100m", memory: "128Mi" }
